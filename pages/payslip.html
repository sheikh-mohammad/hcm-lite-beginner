<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payslip · HCM Lite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div class="row">
        <span class="brand-mark" aria-hidden="true">H</span>
        <div>
          <div class="brand" style="font-size:1rem;">HCM Lite</div>
          <p class="brand-sub">Compensation</p>
        </div>
      </div>
      <div class="row">
        <button class="btn secondary" onclick="window.print()">Print / Save PDF</button>
        <button class="btn secondary" onclick="logout()">Sign out</button>
      </div>
    </header>

    <nav class="nav" id="nav" aria-label="Navigation"></nav>

    <main>
      <section class="page-intro">
        <span class="eyebrow">Payroll</span>
        <h1>Payslip</h1>
        <p>Monthly compensation summary including salary, attendance deductions, and net payable amount.</p>
      </section>

      <section class="card" id="slip"></section>
    </main>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/employees.js"></script>
  <script src="../js/attendance.js"></script>
  <script src="../js/leave.js"></script>
  <script src="../js/helper.js"></script>
  <script>
    const u = currentUser();
    if (!u) location.href = 'login.html';

    const nav = document.getElementById('nav');
    nav.innerHTML = u.role === 'admin'
      ? `<a href="admin.html">Dashboard</a><a href="employees.html">Employees</a><a href="leaves.html">Leaves</a><a class="active" href="payslip.html">Payslips</a><a href="settings.html">Settings</a>`
      : `<a href="employee.html">My space</a><a class="active" href="payslip.html">Payslip</a>`;

    mountChat(u);

    const empId = u.role === 'admin'
      ? Number(new URLSearchParams(location.search).get('emp')) || (employees()[0] && employees()[0].id)
      : u.id;

    const e = Store.users().find(x => x.id === empId) || (employees().find(x => x.id === empId)) || {};
    const now = new Date();
    const y = now.getFullYear();
    const m = now.getMonth();
    const wd = typeof workingDaysInMonth === 'function' ? workingDaysInMonth(y, m) : 22;
    const att = (Store.att ? Store.att() : []).filter(a => a.empId === empId && a.date && a.date.startsWith(`${y}-${String(m + 1).padStart(2, '0')}`));
    const absent = att.filter(a => a.status === 'absent').length;
    const half = att.filter(a => a.status === 'half').length;
    const salary = Number(e.salary) || 0;
    const perDay = wd ? salary / wd : 0;
    const ded = perDay * (absent + 0.5 * half);
    const net = salary - ded;

    document.getElementById('slip').innerHTML = `
      <div class="card-header" style="margin-bottom: 24px;">
        <div>
          <h2 style="margin-bottom:4px;">${(Store.company && Store.company()) ? Store.company().name : 'Company'}</h2>
          <p>Payslip for ${now.toLocaleString('default', { month: 'long' })} ${y}</p>
        </div>
        <div style="text-align:right;">
          <p class="muted text-sm">Employee</p>
          <p style="font-weight:700; color:var(--color-text);">${e.name || '—'}</p>
          <p class="muted text-sm">${e.department || '—'} ${e.email ? '· ' + e.email : ''}</p>
        </div>
      </div>

      <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom: 20px;">
        <div class="card" style="padding:16px; box-shadow:none; background:var(--color-surface-alt);">
          <p class="muted text-sm" style="font-weight:600; text-transform:uppercase; letter-spacing:.04em;">Monthly salary</p>
          <p style="font-size:1.5rem; font-weight:700; color:var(--color-text); margin-top:4px;">${salary.toLocaleString()}</p>
        </div>
        <div class="card" style="padding:16px; box-shadow:none; background:var(--color-surface-alt);">
          <p class="muted text-sm" style="font-weight:600; text-transform:uppercase; letter-spacing:.04em;">Working days</p>
          <p style="font-size:1.5rem; font-weight:700; color:var(--color-text); margin-top:4px;">${wd}</p>
        </div>
        <div class="card" style="padding:16px; box-shadow:none; background:var(--color-surface-alt);">
          <p class="muted text-sm" style="font-weight:600; text-transform:uppercase; letter-spacing:.04em;">Per day</p>
          <p style="font-size:1.5rem; font-weight:700; color:var(--color-text); margin-top:4px;">${perDay.toFixed(2)}</p>
        </div>
      </div>

      <div style="border:1px solid var(--color-border); border-radius: var(--radius-md); overflow:hidden;">
        <div style="display:flex; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--color-border);"><span class="muted">Absent days</span><strong style="color:var(--color-text);">${absent}</strong></div>
        <div style="display:flex; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--color-border);"><span class="muted">Half days</span><strong style="color:var(--color-text);">${half}</strong></div>
        <div style="display:flex; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--color-border);"><span class="muted">Total deduction</span><strong style="color:var(--color-danger);">${ded.toFixed(2)}</strong></div>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:16px; background:var(--color-surface-alt);"><span style="font-weight:700; color:var(--color-text);">Net payable</span><span style="font-size:1.6rem; font-weight:700; color:var(--color-accent);">${net.toFixed(2)}</span></div>
      </div>`;
  </script>
</body>
</html>
