<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings · HCM Lite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@500;600;700&family=Wix+Madefor+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div class="row">
        <span class="brand-mark" aria-hidden="true">H</span>
        <div>
          <div class="brand" style="font-size:1rem;">HCM Lite</div>
          <p class="brand-sub">Configuration</p>
        </div>
      </div>
      <button class="btn secondary" onclick="logout()">Sign out</button>
    </header>

    <nav class="nav" aria-label="Admin navigation">
      <a href="admin.html">Dashboard</a>
      <a href="employees.html">Employees</a>
      <a href="leaves.html">Leaves</a>
      <a href="payslip.html">Payslips</a>
      <a class="active" href="settings.html">Settings</a>
    </nav>

    <main>
      <section class="page-intro">
        <h1>Settings</h1>
        <p>Manage company details, attendance rules, and leave policy for your organization.</p>
      </section>

      <section class="card" style="max-width: 760px;">
        <div class="card-header">
          <div>
            <h2>General configuration</h2>
            <p>Update your organization information and defaults.</p>
          </div>
        </div>

        <div class="form-grid">
          <div>
            <label class="label" for="cn">Company name</label>
            <input class="input" id="cn" placeholder="Company name">
          </div>
          <div>
            <label class="label" for="st">Office start time</label>
            <input class="input" id="st" type="time">
          </div>
          <div>
            <label class="label" for="gr">Grace period (minutes)</label>
            <input class="input" id="gr" type="number" min="0" placeholder="e.g. 15">
          </div>
          <div>
            <label class="label" for="q">Yearly leave quota (days)</label>
            <input class="input" id="q" type="number" min="0" placeholder="e.g. 12">
          </div>
        </div>

        <div class="form-actions row">
          <button class="btn" onclick="save()">Save changes</button>
          <span class="success-msg" id="saveMsg" role="status" aria-live="polite"></span>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/employees.js"></script>
  <script src="../js/attendance.js"></script>
  <script src="../js/leave.js"></script>
  <script src="../js/helper.js"></script>
  <script>
    requireRole('admin');
    mountChat(currentUser());

    const c = Store.company() || {};
    document.getElementById('cn').value = c.name || '';
    document.getElementById('st').value = c.start || '';
    document.getElementById('gr').value = c.grace ?? '';
    document.getElementById('q').value = c.quota ?? '';

    function save() {
      const comp = Store.company() || {};
      comp.name = document.getElementById('cn').value;
      comp.start = document.getElementById('st').value;
      comp.grace = Number(document.getElementById('gr').value);
      comp.quota = Number(document.getElementById('q').value);
      Store.setCompany(comp);
      const msg = document.getElementById('saveMsg');
      msg.textContent = 'Settings saved successfully.';
      setTimeout(() => { msg.textContent = ''; }, 2500);
    }
  </script>
</body>
</html>
