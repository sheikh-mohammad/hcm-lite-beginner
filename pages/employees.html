<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employees</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="container">
<div class="nav"><a href="admin.html">Dashboard</a><a href="employees.html">Employees</a><a href="leaves.html">Leaves</a><a href="settings.html">Settings</a><a href="payslip.html">Payslip</a><a href="#" onclick="logout()">Logout</a></div>
<h1>Employees</h1>
<div class="card">
<label class="label">Name</label><input class="input" id="en">
<label class="label">Email</label><input class="input" id="ee">
<label class="label">Password</label><input class="input" id="ep">
<label class="label">Department</label><input class="input" id="ed">
<label class="label">Salary</label><input class="input" id="es" type="number">
<button class="btn" onclick="add()">Add employee</button>
<div class="error" id="eerr"></div>
</div>
<div class="card" style="margin-top:16px">
<input class="input" id="search" placeholder="Search" oninput="render()">
<table class="table"><thead><tr><th>Name</th><th>Email</th><th>Dept</th><th>Salary</th><th></th></tr></thead><tbody id="tbody"></tbody></table>
</div>
</div>
<script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/employees.js"></script><script src="../js/attendance.js"></script><script src="../js/leave.js"></script><script src="../js/helper.js"></script>
<script>
requireRole('admin');
function add(){const r=addEmployee({name:document.getElementById('en').value,email:document.getElementById('ee').value,password:document.getElementById('ep').value,department:document.getElementById('ed').value,salary:document.getElementById('es').value});if(!r.ok){document.getElementById('eerr').textContent=r.msg;return}render()}
function render(){const q=document.getElementById('search').value.toLowerCase();const rows=employees().filter(e=>e.name.toLowerCase().includes(q)||e.department.toLowerCase().includes(q));document.getElementById('tbody').innerHTML=rows.map(e=>`<tr><td>${e.name}</td><td>${e.email}</td><td>${e.department}</td><td>${e.salary}</td><td><button class="btn danger" onclick="del(${e.id})">Delete</button></td></tr>`).join('')}
function del(id){deleteEmployee(id);render()}
render();
</script>
</body></html>
`
