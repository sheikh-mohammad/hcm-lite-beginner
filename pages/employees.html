<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employees · HCM Lite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@500;600;700&family=Wix+Madefor+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div class="row">
        <span class="brand-mark" aria-hidden="true">H</span>
        <div>
          <div class="brand" style="font-size:1rem;">HCM Lite</div>
          <p class="brand-sub">Team management</p>
        </div>
      </div>
      <button class="btn secondary" onclick="logout()">Sign out</button>
    </header>

    <nav class="nav" aria-label="Admin navigation">
      <a href="admin.html">Dashboard</a>
      <a class="active" href="employees.html">Employees</a>
      <a href="leaves.html">Leaves</a>
      <a href="payslip.html">Payslips</a>
      <a href="settings.html">Settings</a>
    </nav>

    <main>
      <section class="page-intro">
        <h1>Employees</h1>
        <p>Add new team members, search the roster, and keep employee information organized.</p>
      </section>

      <section class="grid" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start;">
        <article class="card">
          <div class="card-header">
            <div>
              <h2>Add employee</h2>
              <p>Create a new employee account.</p>
            </div>
          </div>
          <label class="label" for="en">Full name</label>
          <input class="input" id="en" placeholder="Full name" autocomplete="name">

          <label class="label" for="ee">Email</label>
          <input class="input" id="ee" type="email" placeholder="name@company.com" autocomplete="email">

          <label class="label" for="ep">Password</label>
          <input class="input" id="ep" type="password" placeholder="Temporary password" autocomplete="new-password">

          <label class="label" for="ed">Department</label>
          <input class="input" id="ed" placeholder="e.g. Engineering">

          <label class="label" for="es">Salary</label>
          <input class="input" id="es" type="number" placeholder="Monthly salary">

          <div class="form-actions">
            <button class="btn w-full" onclick="add()">Add employee</button>
          </div>
          <div class="error" id="eerr" role="status" aria-live="polite"></div>
        </article>

        <article class="card">
          <div class="card-header" style="align-items: center;">
            <div>
              <h2>Team roster</h2>
              <p>Search by name or department.</p>
            </div>
            <div style="min-width: 240px; flex: 1; max-width: 360px;">
              <label class="label mt-0" for="search" style="position:absolute; left:-9999px;">Search employees</label>
              <input class="input" id="search" placeholder="Search employees..." oninput="render()" style="margin-top:0;">
            </div>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Department</th>
                  <th>Salary</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </article>
      </section>
    </main>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/employees.js"></script>
  <script src="../js/attendance.js"></script>
  <script src="../js/leave.js"></script>
  <script src="../js/helper.js"></script>
  <script>
    requireRole('admin');
    mountChat(currentUser());

    function add() {
      const r = addEmployee({
        name: document.getElementById('en').value,
        email: document.getElementById('ee').value,
        password: document.getElementById('ep').value,
        department: document.getElementById('ed').value,
        salary: document.getElementById('es').value
      });
      if (!r.ok) {
        document.getElementById('eerr').textContent = r.msg;
        return;
      }
      document.getElementById('eerr').textContent = '';
      document.getElementById('en').value = '';
      document.getElementById('ee').value = '';
      document.getElementById('ep').value = '';
      document.getElementById('ed').value = '';
      document.getElementById('es').value = '';
      render();
    }

    function render() {
      const q = document.getElementById('search').value.toLowerCase();
      const rows = employees().filter(e => (e.name || '').toLowerCase().includes(q) || (e.department || '').toLowerCase().includes(q));
      document.getElementById('tbody').innerHTML = rows.map(e => `<tr>
        <td style="font-weight:600; color:var(--text);">${e.name || '—'}</td>
        <td>${e.email || '—'}</td>
        <td><span class="badge">${e.department || '—'}</span></td>
        <td>${e.salary ? Number(e.salary).toLocaleString() : '—'}</td>
        <td><button class="btn danger small" onclick="del(${e.id})">Delete</button></td>
      </tr>`).join('') || '<tr><td colspan="5" class="muted">No employees found.</td></tr>';
    }

    window.del = (id) => { if (confirm('Delete this employee? This will remove related records.')) { deleteEmployee(id); render(); } };
    render();
  </script>
</body>
</html>
