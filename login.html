<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · HCM Lite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="min-height:100vh;display:flex;flex-direction:column;justify-content:center">
    <header style="display:flex;align-items:center;justify-content:space-between;margin-bottom:clamp(30px,8vw,60px)">
      <a href="index.html" style="display:flex;align-items:center;gap:12px">
        <div style="width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,var(--accent),var(--accent-2));box-shadow:0 0 0 10px rgba(34,211,238,.1)"></div>
        <span style="font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:12px;color:var(--muted)">HCM Lite</span>
      </a>
      <a class="btn secondary" href="index.html">Back to home</a>
    </header>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(20px,6vw,40px);align-items:center">
      <div>
        <span class="eyebrow" style="letter-spacing:.4em;text-transform:uppercase;font-size:12px;color:var(--muted)">Welcome</span>
        <h1 style="margin-top:16px">Access your workspace</h1>
        <p style="color:var(--text-secondary);max-width:460px">A bold, modern HR experience. Set up your company on first run or sign in with your credentials.</p>
      </div>
      <div class="card" style="max-width:460px;width:100%;justify-self:end">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
          <div>
            <h3 style="margin-bottom:6px">Sign in</h3>
            <p style="color:var(--muted)">Enter your details to continue</p>
          </div>
          <div style="width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2))"></div>
        </div>
        <div id="setup" style="display:none">
          <label class="label">Company name</label>
          <input class="input" id="cname" placeholder="e.g. Atlas Studio">
          <label class="label">Admin name</label>
          <input class="input" id="aname" placeholder="Full name">
          <label class="label">Admin email</label>
          <input class="input" id="aemail" placeholder="you@company.com">
          <label class="label">Admin password</label>
          <input class="input" id="apw" type="password" placeholder="Create a password">
          <button class="btn" style="margin-top:20px;width:100%;justify-content:center" onclick="doSetup()">Create company</button>
        </div>
        <div id="login">
          <label class="label">Email</label>
          <input class="input" id="lemail" placeholder="you@company.com">
          <label class="label">Password</label>
          <input class="input" id="lpw" type="password" placeholder="Enter your password">
          <button class="btn" style="margin-top:20px;width:100%;justify-content:center" onclick="doLogin()">Sign in</button>
          <div class="error" id="lerr"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/employees.js"></script><script src="js/attendance.js"></script><script src="js/leave.js"></script><script src="js/helper.js"></script>
  <script>
    if(!Store.company()){document.getElementById('setup').style.display='block';document.getElementById('login').style.display='none'}
    function doSetup(){setupCompany(document.getElementById('cname').value,document.getElementById('aname').value,document.getElementById('aemail').value,document.getElementById('apw').value);location.reload()}
    function doLogin(){if(login(document.getElementById('lemail').value,document.getElementById('lpw').value)){const u=currentUser();location.href=u.role==='admin'?'pages/admin.html':'pages/employee.html'}else document.getElementById('lerr').textContent='Invalid credentials'}
  </script>
</body>
</html>
`
